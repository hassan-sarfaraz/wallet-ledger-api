<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
</Directory>
ServerName localhost
ServerTokens Prod
ServerSignature Off
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5
ListenBacklog 4096
<IfModule mpm_prefork_module>
    StartServers 8
    MinSpareServers 8
    MaxSpareServers 16
    ServerLimit 128
    MaxRequestWorkers 128
    MaxConnectionsPerChild 5000
</IfModule>
